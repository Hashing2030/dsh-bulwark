# 这个文件是包根的 bundle 清单（DSH 生态惯例名），内容必须与 cordis.yml 保持一致。
# 注意：DSH 实际加载的 bundle patch 由 package.json 的 dsh.bundle.patch 指定，
# 当前指向 ./cordis.yml；本文件的存在是为满足 dsh-plugin-lint 的 S3-plugin-manifest
# 规则与打包惯例（tarball 内可见 cordis.patch.yml）。改名/增删 loader 条目时两个文件都要改。
#
# 本地开发补丁（dsh web --patch cordis.yml）
#
# loader 条目按包名解析——根包的 main 指向 dist/index.js。
# 修改源码后执行 pnpm build 再启动。
#
# 逃生通道：设置 DSH_FORTRESS_DISABLE=1 可一键禁用 dsh-bulwark，
# 让 DSH 在完全不加载它的情况下启动；清除该环境变量即恢复。
# 完整说明见 DISASTER-RECOVERY.md。
- insert:
    - id: dsh-bulwark
      name: dsh-bulwark
      disabled: !!js process.env.DSH_FORTRESS_DISABLE === '1'
