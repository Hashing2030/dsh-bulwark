# 本地开发补丁（dsh web --patch cordis.yml）
#
# loader 条目按包名解析——根包的 main 指向 dist/index.js。
# 修改源码后执行 pnpm build 再启动。
#
# 逃生通道：设置 DSH_FORTRESS_DISABLE=1 可一键禁用 dsh-bulwark，
# 让 DSH 在完全不加载它的情况下启动；清除该环境变量即恢复。
# 完整说明见 DISASTER-RECOVERY.md。
- insert:
    - id: dsh-bulwark
      name: dsh-bulwark
      disabled: !!js process.env.DSH_FORTRESS_DISABLE === '1'
